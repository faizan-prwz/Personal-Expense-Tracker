{% extends "base.html" %}
{% block title %}Add Income - Personal Expense Tracker{% endblock %}
{% block header_title %}Add Income Transaction{% endblock %}

{% block content %}
<div class="form-card-container">
    <div class="card form-card">
        <h2>Record New Income</h2>
        <form method="POST" action="{{ url_for('add_income') }}" class="app-form">
            <div class="form-group">
                <label for="source">Income Source <span class="required">*</span></label>
                <input type="text" id="source" name="source" placeholder="e.g. Salary, Freelance, Allowance" required>
            </div>
            <div class="form-group">
                <label for="amount">Amount ($) <span class="required">*</span></label>
                <input type="number" step="0.01" min="0.01" id="amount" name="amount" placeholder="e.g. 1500.00" required>
            </div>
            <div class="form-group">
                <label for="date">Date <span class="required">*</span></label>
                <input type="date" id="date" name="date" required>
            </div>
            <div class="form-group">
                <label for="description">Description (Optional)</label>
                <textarea id="description" name="description" placeholder="Add any extra details..."></textarea>
            </div>
            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Save Income</button>
                <a href="{{ url_for('index') }}" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
