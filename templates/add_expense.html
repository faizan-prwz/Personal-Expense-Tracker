{% extends "base.html" %}
{% block title %}Add Expense - Personal Expense Tracker{% endblock %}
{% block header_title %}Add Expense Transaction{% endblock %}

{% block content %}
<div class="form-card-container">
    <div class="card form-card">
        <h2>Record New Expense</h2>
        <form method="POST" action="{{ url_for('add_expense') }}" class="app-form">
            <div class="form-group">
                <label for="title">Expense Title <span class="required">*</span></label>
                <input type="text" id="title" name="title" placeholder="e.g. Grocery store, Bus pass, Textbook" required>
            </div>
            <div class="form-group">
                <label for="amount">Amount ($) <span class="required">*</span></label>
                <input type="number" step="0.01" min="0.01" id="amount" name="amount" placeholder="e.g. 45.50" required>
            </div>
            <div class="form-group">
                <label for="category">Category <span class="required">*</span></label>
                <select id="category" name="category" required>
                    <option value="" disabled selected>Select a category</option>
                    {% for cat in categories %}
                    <option value="{{ cat }}">{{ cat }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label for="date">Date <span class="required">*</span></label>
                <input type="date" id="date" name="date" required>
            </div>
            <div class="form-group">
                <label for="description">Description (Optional)</label>
                <textarea id="description" name="description" placeholder="Add any extra details..."></textarea>
            </div>
            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Save Expense</button>
                <a href="{{ url_for('index') }}" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
